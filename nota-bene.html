<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="color-scheme" content="light dark">
  <title>Nota Bene</title>
  <!-- Notes are stored encrypted in nota-bene-claude/data/ and decrypted here in the browser.
       Rebuild them with: node nota-bene-claude/build.mjs -->
  <style>
    /* Palette and type follow index.html */
    :root {
      --bg: #faf8f4;
      --panel: #f3f0e9;
      --text: #1f1d1a;
      --muted: #7a746b;
      --border: #e4dfd6;
      --accent: #c2410c;
      --code-bg: #efebe3;
      --hover: #e9e4da;
      --mark: rgba(194, 65, 12, .16);
      --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Charter, Georgia, serif;
      --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #14130f;
        --panel: #1a1915;
        --text: #ece8df;
        --muted: #8f897d;
        --border: #2a2822;
        --accent: #f59e42;
        --code-bg: #211f1a;
        --hover: #25231d;
        --mark: rgba(245, 158, 66, .2);
      }
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      background: var(--bg);
      color: var(--text);
      font: 1.0625rem/1.7 var(--serif);
      -webkit-font-smoothing: antialiased;
    }
    a { color: inherit; text-decoration: underline; text-decoration-color: var(--border); text-underline-offset: .25em; text-decoration-thickness: 1px; }
    a:hover, a:focus-visible { color: var(--accent); text-decoration-color: var(--accent); }
    a:focus-visible, button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    ::selection { background: var(--accent); color: var(--bg); }
    h1, h2, h3, h4 { font-weight: 400; line-height: 1.2; letter-spacing: -.01em; }
    .brand { font-family: var(--serif); font-weight: 400; letter-spacing: -.02em; }
    .brand span { color: var(--accent); }
    button, input { font: inherit; color: inherit; }

    /* Lock screen */
    #lock {
      min-height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    #lock form {
      width: 100%;
      max-width: 360px;
      text-align: center;
    }
    #lock .brand { font-size: 3rem; margin: 0 0 4px; }
    #lock p { color: var(--muted); font-style: italic; margin: 0 0 24px; }
    #lock input {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--panel);
    }
    #lock button {
      margin-top: 12px;
      width: 100%;
      padding: 10px;
      border: 0;
      border-radius: 6px;
      background: var(--accent);
      color: var(--bg);
      font: 600 .8rem/1.4 var(--sans);
      letter-spacing: .12em;
      text-transform: uppercase;
      cursor: pointer;
    }
    #lock button:disabled { opacity: .6; cursor: wait; }
    #lock-error { color: #c0392b; min-height: 1.6em; margin-top: 12px; }

    /* App layout */
    #app { display: none; height: 100%; }
    #app.open { display: flex; }
    #sidebar {
      width: 300px;
      flex: 0 0 300px;
      background: var(--panel);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      min-height: 0;
    }
    .side-head { padding: 16px 16px 8px; }
    .side-head .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .side-head .brand { font-size: 1.7rem; text-decoration: none; }
    .side-head .brand:hover { color: inherit; }
    .icon-btn {
      border: 1px solid var(--border);
      background: transparent;
      border-radius: 6px;
      padding: 4px 10px;
      font: .68rem/1.4 var(--sans);
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--muted);
      cursor: pointer;
    }
    .icon-btn:hover { background: var(--hover); color: var(--text); }
    #search {
      margin-top: 10px;
      width: 100%;
      padding: 7px 10px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--bg);
      font-family: var(--sans);
      font-size: .85rem;
    }
    #tree { overflow-y: auto; padding: 4px 8px 24px; flex: 1; font: .84rem/1.5 var(--sans); }
    #tree details { margin: 0; }
    #tree summary {
      cursor: pointer;
      padding: 3px 8px;
      border-radius: 4px;
      font-weight: 600;
      list-style: none;
      user-select: none;
    }
    #tree summary::-webkit-details-marker { display: none; }
    #tree summary::before { content: '▸'; display: inline-block; width: 1em; color: var(--muted); }
    #tree details[open] > summary::before { content: '▾'; }
    #tree summary:hover { background: var(--hover); }
    #tree .children { padding-left: 14px; }
    #tree a {
      display: block;
      padding: 3px 8px 3px calc(8px + 1em);
      border-radius: 4px;
      color: var(--text);
      text-decoration: none;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    #tree a:hover { background: var(--hover); color: var(--text); }
    #tree a.active { background: var(--hover); color: var(--accent); font-weight: 600; }
    #tree .hit-count { color: var(--muted); font-size: .8em; margin-left: 4px; }
    #tree a.active .hit-count { color: inherit; }
    #tree .path { display: block; color: var(--muted); font-size: .78em; }
    #tree a.active .path { color: inherit; opacity: .85; }
    #tree .empty { color: var(--muted); padding: 8px; }

    #main { flex: 1; overflow-y: auto; min-width: 0; }
    #content { max-width: 48rem; margin: 0 auto; padding: 3rem 2.5rem 5rem; }
    .crumbs { color: var(--muted); font: .72rem/1.4 var(--sans); letter-spacing: .12em; text-transform: uppercase; margin-bottom: 8px; }
    #menu-btn { display: none; }

    /* Rendered markdown */
    .md { overflow-wrap: break-word; }
    .md a { overflow-wrap: anywhere; }
    .md h1 { font-size: clamp(2rem, 6vw, 2.8rem); letter-spacing: -.02em; margin: .2em 0 .6em; }
    .md h2 { font-size: 1.7rem; margin: 1.8em 0 .5em; border-bottom: 1px solid var(--border); padding-bottom: .2em; }
    .md h3 { font-size: 1.3rem; margin: 1.5em 0 .4em; font-weight: 600; }
    .md h4, .md h5, .md h6 { font: 600 .78rem/1.4 var(--sans); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin: 1.5em 0 .4em; }
    .md img { max-width: 100%; height: auto; border-radius: 4px; }
    .md img.missing {
      display: inline-block;
      padding: 6px 10px;
      border: 1px dashed var(--border);
      color: var(--muted);
      font-size: .85rem;
    }
    .md pre {
      background: var(--code-bg);
      padding: 12px 14px;
      border-radius: 6px;
      overflow-x: auto;
      font-size: .85rem;
      line-height: 1.45;
    }
    .md code { background: var(--code-bg); padding: .1em .3em; border-radius: 3px; font: .82em var(--mono); }
    .md pre code { background: none; padding: 0; font-size: 1em; }
    .md blockquote { margin: 1em 0; padding: .2em 1em; border-left: 2px solid var(--accent); color: var(--muted); }
    .md .table-wrap { overflow-x: auto; margin: 1em 0; }
    .md table { border-collapse: collapse; font: .85rem/1.45 var(--sans); }
    .md th, .md td { border: 1px solid var(--border); padding: 5px 9px; text-align: left; vertical-align: top; }
    .md th { background: var(--panel); }
    .md hr { border: 0; border-top: 1px solid var(--border); margin: 2em 0; }
    .md mark { background: var(--mark); color: inherit; }
    .md li > p { margin: .2em 0; }

    @media (max-width: 800px) {
      #app.open { display: block; }
      #sidebar {
        position: fixed;
        inset: 0 auto 0 0;
        width: 85%;
        max-width: 320px;
        z-index: 10;
        transform: translateX(-100%);
        transition: transform .2s;
      }
      #app.nav-open #sidebar { transform: none; box-shadow: 0 0 40px rgba(0,0,0,.3); }
      #main { height: 100%; }
      #content { padding: 16px 16px 60px; }
      #menu-btn { display: inline-block; margin-bottom: 12px; }
    }
  </style>
</head>
<body>
  <div id="lock">
    <form id="lock-form" autocomplete="off">
      <div class="brand">Nota Bene<span>.</span></div>
      <p>These notes are encrypted.</p>
      <input id="pass" type="password" placeholder="Passphrase" autofocus aria-label="Passphrase">
      <button id="unlock-btn" type="submit">Unlock</button>
      <div id="lock-error" role="alert"></div>
    </form>
  </div>

  <div id="app">
    <aside id="sidebar">
      <div class="side-head">
        <div class="row">
          <a class="brand" href="#">Nota Bene<span>.</span></a>
          <button class="icon-btn" id="lock-btn" type="button" title="Forget the passphrase for this tab">Lock</button>
        </div>
        <input id="search" type="search" placeholder="Search notes" aria-label="Search notes">
      </div>
      <nav id="tree"></nav>
    </aside>
    <main id="main">
      <div id="content">
        <button class="icon-btn" id="menu-btn" type="button">☰ Notes</button>
        <div class="crumbs" id="crumbs"></div>
        <article class="md" id="note"></article>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
  <script>
  (() => {
    const DATA = 'nota-bene-claude/data/';
    const KEY_STORE = 'nota-bene-key';
    const $ = (id) => document.getElementById(id);

    let key = null;
    let bundle = null;
    const imageCache = new Map();

    // ---------- crypto ----------
    const b64 = {
      enc: (buf) => btoa(String.fromCharCode(...new Uint8Array(buf))),
      dec: (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0)),
    };

    async function fetchBytes(url) {
      const r = await fetch(url, { cache: 'no-cache' });
      if (!r.ok) throw new Error(`Could not load ${url} (${r.status})`);
      return new Uint8Array(await r.arrayBuffer());
    }

    // File layout from build.mjs: 12-byte IV, then ciphertext with the GCM tag appended
    async function decrypt(bytes) {
      return crypto.subtle.decrypt({ name: 'AES-GCM', iv: bytes.slice(0, 12) }, key, bytes.slice(12));
    }

    async function deriveKey(passphrase) {
      const meta = await (await fetch(DATA + 'meta.json', { cache: 'no-cache' })).json();
      const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(passphrase), 'PBKDF2', false, ['deriveKey']);
      return crypto.subtle.deriveKey(
        { name: 'PBKDF2', salt: b64.dec(meta.salt), iterations: meta.iterations, hash: 'SHA-256' },
        base, { name: 'AES-GCM', length: 256 }, true, ['decrypt']);
    }

    async function loadBundle() {
      const plain = await decrypt(await fetchBytes(DATA + 'notes.bin'));
      const stream = new Blob([plain]).stream().pipeThrough(new DecompressionStream('gzip'));
      return JSON.parse(await new Response(stream).text());
    }

    function saveKey(raw) { try { sessionStorage.setItem(KEY_STORE, b64.enc(raw)); } catch {} }
    function forgetKey() { try { sessionStorage.removeItem(KEY_STORE); } catch {} }
    function storedKey() { try { return sessionStorage.getItem(KEY_STORE); } catch { return null; } }

    async function unlockWith(k) {
      key = k;
      bundle = await loadBundle();
      $('lock').style.display = 'none';
      $('app').classList.add('open');
      buildTree();
      route();
    }

    $('lock-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = $('unlock-btn');
      btn.disabled = true;
      btn.textContent = 'Unlocking…';
      $('lock-error').textContent = '';
      try {
        const k = await deriveKey($('pass').value);
        await unlockWith(k);
        saveKey(await crypto.subtle.exportKey('raw', k));
      } catch (err) {
        key = null;
        $('lock-error').textContent = err.name === 'OperationError' ? 'Wrong passphrase.' : err.message;
      } finally {
        btn.disabled = false;
        btn.textContent = 'Unlock';
      }
    });

    $('lock-btn').addEventListener('click', () => {
      forgetKey();
      location.hash = '';
      location.reload();
    });

    // ---------- paths ----------
    function normalize(p) {
      const out = [];
      for (const part of p.split('/')) {
        if (!part || part === '.') continue;
        if (part === '..') out.pop();
        else out.push(part);
      }
      return out.join('/');
    }
    function dirOf(p) { return p.includes('/') ? p.slice(0, p.lastIndexOf('/')) : ''; }
    function baseOf(p) { return p.slice(p.lastIndexOf('/') + 1); }
    function title(p) { return baseOf(p).replace(/\.md$/i, ''); }
    function safeDecode(s) { try { return decodeURIComponent(s); } catch { return s; } }
    function isExternal(href) { return /^[a-z][a-z0-9+.-]*:/i.test(href) || href.startsWith('//'); }

    // Typora wrote many image paths that no longer match the folder layout,
    // so fall back to a unique file-name match anywhere in the notes.
    function findImage(notePath, src) {
      const clean = safeDecode(src.split(/[?#]/)[0]).replace(/\\/g, '/');
      const direct = normalize(dirOf(notePath) + '/' + clean);
      if (bundle.images[direct]) return bundle.images[direct];
      const name = baseOf(clean);
      const hits = Object.keys(bundle.images).filter((p) => baseOf(p) === name);
      return hits.length ? bundle.images[hits[0]] : null;
    }

    async function imageUrl(img) {
      if (!imageCache.has(img.id)) {
        imageCache.set(img.id, (async () => {
          const plain = await decrypt(await fetchBytes(`${DATA}img/${img.id}.bin`));
          return URL.createObjectURL(new Blob([plain], { type: img.type }));
        })());
      }
      return imageCache.get(img.id);
    }

    // ---------- sidebar ----------
    function sortedNotes() {
      return Object.keys(bundle.notes).sort((a, b) => a.localeCompare(b, undefined, { sensitivity: 'base' }));
    }

    function noteLink(p, extra) {
      const a = document.createElement('a');
      a.href = '#/' + encodeURI(p);
      a.dataset.path = p;
      a.textContent = title(p);
      if (extra) a.append(extra);
      return a;
    }

    function buildTree() {
      const root = { files: [], dirs: {} };
      for (const p of sortedNotes()) {
        const parts = p.split('/');
        let node = root;
        for (const d of parts.slice(0, -1)) node = node.dirs[d] ??= { files: [], dirs: {} };
        node.files.push(p);
      }
      const render = (node, container) => {
        for (const p of node.files) container.append(noteLink(p));
        const dirs = Object.keys(node.dirs).sort((a, b) => {
          // keep archive folders at the bottom
          const wa = a.toLowerCase() === 'archive', wb = b.toLowerCase() === 'archive';
          return wa - wb || a.localeCompare(b, undefined, { sensitivity: 'base' });
        });
        for (const d of dirs) {
          const det = document.createElement('details');
          const sum = document.createElement('summary');
          sum.textContent = d;
          const kids = document.createElement('div');
          kids.className = 'children';
          det.append(sum, kids);
          render(node.dirs[d], kids);
          container.append(det);
        }
      };
      const tree = $('tree');
      tree.replaceChildren();
      render(root, tree);
      markActive();
    }

    function runSearch(q) {
      const tree = $('tree');
      q = q.trim().toLowerCase();
      if (!q) return buildTree();
      const results = [];
      for (const p of sortedNotes()) {
        const inTitle = p.toLowerCase().includes(q);
        const text = bundle.notes[p].toLowerCase();
        let count = 0, i = -1;
        while ((i = text.indexOf(q, i + 1)) !== -1) count++;
        if (inTitle || count) results.push({ p, inTitle, count });
      }
      results.sort((a, b) => b.inTitle - a.inTitle || b.count - a.count);
      tree.replaceChildren();
      if (!results.length) {
        const d = document.createElement('div');
        d.className = 'empty';
        d.textContent = 'No matches.';
        tree.append(d);
        return;
      }
      for (const r of results) {
        const extra = document.createDocumentFragment();
        if (r.count) {
          const c = document.createElement('span');
          c.className = 'hit-count';
          c.textContent = `(${r.count})`;
          extra.append(c);
        }
        if (dirOf(r.p)) {
          const s = document.createElement('span');
          s.className = 'path';
          s.textContent = dirOf(r.p);
          extra.append(s);
        }
        tree.append(noteLink(r.p, extra));
      }
      markActive();
    }

    let searchTimer;
    $('search').addEventListener('input', (e) => {
      clearTimeout(searchTimer);
      searchTimer = setTimeout(() => runSearch(e.target.value), 120);
    });

    function currentPath() {
      const h = location.hash;
      return h.startsWith('#/') ? safeDecode(h.slice(2)) : null;
    }

    function markActive() {
      const cur = currentPath();
      for (const a of $('tree').querySelectorAll('a')) {
        const on = a.dataset.path === cur;
        a.classList.toggle('active', on);
        if (on) {
          for (let d = a.parentElement.closest('details'); d; d = d.parentElement.closest('details')) d.open = true;
        }
      }
    }

    // ---------- rendering ----------
    function slug(s) {
      return s.toLowerCase().trim().replace(/[^\p{L}\p{N}\s-]/gu, '').replace(/\s+/g, '-');
    }

    function preprocess(md) {
      // Typora accepts spaces in link targets; CommonMark needs them wrapped in <...>
      md = md.replace(/(!?\[[^\]\n]*\]\()([^)<>"\n]*? [^)<>"\n]*?)\)/g, '$1<$2>)');
      // ==highlight==
      md = md.replace(/==([^=\n]+)==/g, '<mark>$1</mark>');
      return md;
    }

    function showWelcome() {
      $('crumbs').textContent = '';
      const n = Object.keys(bundle.notes).length;
      const built = new Date(bundle.built).toLocaleDateString(undefined, { year: 'numeric', month: 'long', day: 'numeric' });
      const note = $('note');
      note.replaceChildren();
      const h = document.createElement('h1');
      h.textContent = 'Nota Bene';
      const p = document.createElement('p');
      p.textContent = `${n} notes, last built ${built}. Pick one from the list or search.`;
      note.append(h, p);
      document.title = 'Nota Bene';
    }

    function renderNote(path) {
      const src = bundle.notes[path];
      if (src == null) {
        $('crumbs').textContent = '';
        $('note').innerHTML = '<h1>Not found</h1>';
        $('note').querySelector('h1').insertAdjacentText('afterend', `No note at "${path}".`);
        return;
      }
      document.title = `${title(path)} · Nota Bene`;
      $('crumbs').textContent = dirOf(path).split('/').filter(Boolean).join(' / ');

      // Parse into a <template> so relative <img> sources are never fetched from the server
      const tpl = document.createElement('template');
      tpl.innerHTML = DOMPurify.sanitize(marked.parse(preprocess(src), { gfm: true, breaks: false }));
      const frag = tpl.content;

      const used = new Set();
      for (const h of frag.querySelectorAll('h1,h2,h3,h4,h5,h6')) {
        let id = slug(h.textContent) || 'section', n = 1;
        while (used.has(id)) id = `${slug(h.textContent)}-${n++}`;
        used.add(id);
        h.id = id;
      }

      for (const t of frag.querySelectorAll('table')) {
        const wrap = document.createElement('div');
        wrap.className = 'table-wrap';
        t.replaceWith(wrap);
        wrap.append(t);
      }

      for (const a of frag.querySelectorAll('a[href]')) {
        const href = a.getAttribute('href');
        if (href.startsWith('#')) {
          a.dataset.anchor = slug(safeDecode(href.slice(1)));
        } else if (isExternal(href)) {
          a.target = '_blank';
          a.rel = 'noopener noreferrer';
        } else {
          const [file, frag2] = href.split('#');
          const target = normalize(dirOf(path) + '/' + safeDecode(file));
          if (bundle.notes[target] != null) {
            a.setAttribute('href', '#/' + encodeURI(target));
            if (frag2) a.dataset.anchorAfter = slug(safeDecode(frag2));
          } else {
            a.removeAttribute('href');
            a.title = `${file} (not in the published notes)`;
          }
        }
      }

      const pending = [];
      for (const img of frag.querySelectorAll('img')) {
        const srcAttr = img.getAttribute('src') || '';
        img.removeAttribute('src');
        img.loading = 'lazy';
        if (srcAttr.startsWith('data:') || /^https?:/i.test(srcAttr)) { img.src = srcAttr; continue; }
        const found = findImage(path, srcAttr);
        if (!found) {
          img.classList.add('missing');
          img.alt = `[missing image: ${img.alt || baseOf(srcAttr)}]`;
          continue;
        }
        pending.push(imageUrl(found).then((u) => { img.src = u; }).catch(() => img.classList.add('missing')));
      }

      const note = $('note');
      note.replaceChildren(frag);
      $('main').scrollTop = 0;
      return Promise.all(pending);
    }

    function route() {
      if (!bundle) return;
      const p = currentPath();
      $('app').classList.remove('nav-open');
      if (p) renderNote(p); else showWelcome();
      markActive();
    }

    window.addEventListener('hashchange', route);

    $('note').addEventListener('click', (e) => {
      const a = e.target.closest('a');
      if (!a) return;
      if (a.dataset.anchor) {
        e.preventDefault();
        document.getElementById(a.dataset.anchor)?.scrollIntoView({ behavior: 'smooth' });
      } else if (a.dataset.anchorAfter) {
        const id = a.dataset.anchorAfter;
        setTimeout(() => document.getElementById(id)?.scrollIntoView(), 50);
      }
    });

    $('menu-btn').addEventListener('click', () => $('app').classList.toggle('nav-open'));
    $('main').addEventListener('click', (e) => {
      if (e.target.id !== 'menu-btn') $('app').classList.remove('nav-open');
    });

    // Reuse the key from earlier in this tab, if any
    const saved = storedKey();
    if (saved) {
      crypto.subtle.importKey('raw', b64.dec(saved), 'AES-GCM', true, ['decrypt'])
        .then(unlockWith)
        .catch(() => { forgetKey(); key = null; });
    }
  })();
  </script>
</body>
</html>
